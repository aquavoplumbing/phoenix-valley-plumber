<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" fill="none">
  <rect width="800" height="520" fill="#FAF6EF" rx="16"/>

  <!-- Title -->
  <text x="400" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0B2A4A" text-anchor="middle">Traditional Trenching vs. Trenchless Sewer Repair</text>
  <text x="400" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4A5A70" text-anchor="middle">Comparing open excavation with cured-in-place pipe (CIPP) lining for Phoenix yards</text>

  <!-- Left: Traditional Open Trench -->
  <g transform="translate(60, 100)">
    <rect width="320" height="380" rx="12" fill="#FFFFFF" stroke="#0B2A4A" stroke-width="1.5"/>
    <text x="160" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0B2A4A" text-anchor="middle">Traditional Open Trench</text>

    <!-- Ground Level -->
    <rect x="20" y="60" width="280" height="20" fill="#C2B29A"/>
    <text x="30" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#574936" font-weight="700">Driveway / Desert Landscaping</text>

    <!-- Deep Excavated Trench -->
    <path d="M70 80 L90 220 H230 L250 80 Z" fill="#E2D9C8" stroke="#78350F" stroke-width="2"/>
    <text x="160" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350F" text-anchor="middle">Full Yard Excavation</text>
    <text x="160" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350F" text-anchor="middle">5–8 ft deep open ditch</text>

    <!-- New Pipe at Bottom -->
    <rect x="40" y="220" width="240" height="24" rx="4" fill="#1479AE" stroke="#0B2A4A" stroke-width="2"/>

    <!-- Pros & Cons -->
    <text x="30" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1FA971">✓ Fixes completely collapsed pipes</text>
    <text x="30" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#BE123C">✕ Destroys pavers, concrete &amp; trees</text>
    <text x="30" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A5A70">• Restoration costs: $2,500 – $7,000+</text>
    <text x="30" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A5A70">• Job timeline: 3 to 5 days</text>
  </g>

  <!-- Right: Trenchless CIPP / Pipe Bursting -->
  <g transform="translate(420, 100)">
    <rect width="320" height="380" rx="12" fill="#FFFFFF" stroke="#1FA971" stroke-width="2"/>
    <text x="160" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0B2A4A" text-anchor="middle">Trenchless CIPP Lining</text>

    <!-- Intact Ground Level -->
    <rect x="20" y="60" width="280" height="20" fill="#C2B29A"/>
    <text x="30" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1FA971" font-weight="700">Landscaping Completely Untouched</text>

    <!-- Small Access Pit Left & Right -->
    <rect x="35" y="80" width="40" height="140" fill="#E2D9C8" stroke="#1FA971" stroke-width="1.5"/>
    <rect x="245" y="80" width="40" height="140" fill="#E2D9C8" stroke="#1FA971" stroke-width="1.5"/>
    <text x="55" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0B2A4A" text-anchor="middle">Entry Pit</text>
    <text x="265" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0B2A4A" text-anchor="middle">Exit Pit</text>

    <!-- Intact Soil Between Pits -->
    <rect x="75" y="80" width="170" height="140" fill="#C2B29A" opacity="0.6"/>
    <text x="160" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0B2A4A" text-anchor="middle">Undisturbed Earth</text>

    <!-- Existing Pipe with Epoxy Liner Inside -->
    <rect x="20" y="220" width="280" height="26" rx="4" fill="#64748B" stroke="#334155" stroke-width="2"/>
    <rect x="24" y="224" width="272" height="18" rx="2" fill="#1E9BD7"/>
    <text x="160" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Seamless Epoxy Resin Liner</text>

    <!-- Pros & Cons -->
    <text x="30" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1FA971">✓ Zero damage to yard or concrete</text>
    <text x="30" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1FA971">✓ 50+ year lifespan rated pipe</text>
    <text x="30" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A5A70">• Restoration costs: $0</text>
    <text x="30" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A5A70">• Job timeline: 1 to 2 days</text>
  </g>
</svg>
