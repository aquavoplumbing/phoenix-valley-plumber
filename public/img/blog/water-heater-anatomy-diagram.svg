<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#FAF6EF" rx="16"/>
  
  <!-- Title & Header -->
  <text x="400" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0B2A4A" text-anchor="middle">Standard Storage Tank Water Heater Anatomy</text>
  <text x="400" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4A5A70" text-anchor="middle">Key internal components, safety mechanisms, and wear points in hard water</text>

  <!-- Water Heater Outer Shell -->
  <rect x="280" y="110" width="240" height="420" rx="36" fill="#FFFFFF" stroke="#0B2A4A" stroke-width="2.5"/>
  <rect x="296" y="130" width="208" height="375" rx="24" fill="#E6F4FB" stroke="#1E9BD7" stroke-width="1.75"/>

  <!-- Water Level Fill -->
  <path d="M296 220 Q348 215 400 220 T504 220 V485 Q504 505 400 505 Q296 505 296 485 Z" fill="#1E9BD7" opacity="0.18"/>

  <!-- Cold Water Dip Tube -->
  <path d="M340 90 V460" stroke="#1479AE" stroke-width="6" stroke-linecap="round"/>
  <path d="M340 90 V70" stroke="#1479AE" stroke-width="8" stroke-linecap="round"/>
  <circle cx="340" cy="460" r="4" fill="#1479AE"/>

  <!-- Hot Water Outlet -->
  <path d="M460 90 V140" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round"/>
  <path d="M460 90 V70" stroke="#FF7A1A" stroke-width="8" stroke-linecap="round"/>

  <!-- Sacrificial Anode Rod -->
  <line x1="400" y1="90" x2="400" y2="420" stroke="#0B2A4A" stroke-width="8" stroke-dasharray="14 3"/>
  <circle cx="400" cy="90" r="6" fill="#0B2A4A"/>

  <!-- T&P Relief Valve & Discharge Pipe -->
  <circle cx="496" cy="180" r="8" fill="#FF7A1A" stroke="#0B2A4A" stroke-width="2"/>
  <path d="M504 180 H540 V500" stroke="#0B2A4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M540 500 V520" stroke="#0B2A4A" stroke-width="4" stroke-dasharray="4 4"/>

  <!-- Sediment Layer at Bottom -->
  <path d="M298 480 Q400 470 502 480 V490 Q400 505 298 490 Z" fill="#FFB020" opacity="0.75"/>

  <!-- Drain Valve -->
  <rect x="496" y="475" width="28" height="16" rx="3" fill="#0B2A4A"/>
  <circle cx="528" cy="483" r="6" fill="#FF7A1A"/>

  <!-- Thermostat / Access Panels -->
  <rect x="375" y="240" width="50" height="40" rx="4" fill="#FAF6EF" stroke="#0B2A4A" stroke-width="2"/>
  <circle cx="400" cy="260" r="6" fill="#1E9BD7"/>
  <rect x="375" y="380" width="50" height="40" rx="4" fill="#FAF6EF" stroke="#0B2A4A" stroke-width="2"/>
  <circle cx="400" cy="400" r="6" fill="#1E9BD7"/>

  <!-- Callouts & Labels Left -->
  <!-- Cold Inlet & Dip Tube -->
  <path d="M140 130 H330" stroke="#1479AE" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="140" cy="130" r="4" fill="#1479AE"/>
  <text x="130" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1479AE" text-anchor="end">Cold Water Inlet &amp; Dip Tube</text>
  <text x="130" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70" text-anchor="end">Directs incoming cold water to tank bottom</text>

  <!-- Anode Rod -->
  <path d="M160 270 H395" stroke="#0B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="160" cy="270" r="4" fill="#0B2A4A"/>
  <text x="150" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="end">Sacrificial Anode Rod</text>
  <text x="150" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70" text-anchor="end">Corrodes first to protect steel tank lining</text>

  <!-- Sediment Zone -->
  <path d="M160 485 H320" stroke="#FF7A1A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="160" cy="485" r="4" fill="#FF7A1A"/>
  <text x="150" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="end">Sediment &amp; Scale Accumulation</text>
  <text x="150" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70" text-anchor="end">Hard Phoenix water deposits calcium crust</text>

  <!-- Callouts & Labels Right -->
  <!-- Hot Water Outlet -->
  <path d="M465 110 H640" stroke="#FF7A1A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="640" cy="110" r="4" fill="#FF7A1A"/>
  <text x="650" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FF7A1A" text-anchor="start">Hot Water Outlet</text>
  <text x="650" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70" text-anchor="start">Draws hottest water from top of tank</text>

  <!-- T&P Valve -->
  <path d="M515 180 H640" stroke="#0B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="640" cy="180" r="4" fill="#0B2A4A"/>
  <text x="650" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="start">T&amp;P Relief Valve &amp; Pipe</text>
  <text x="650" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70" text-anchor="start">Safety release for excessive heat/pressure</text>

  <!-- Thermostat -->
  <path d="M430 380 H640" stroke="#1E9BD7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="640" cy="380" r="4" fill="#1E9BD7"/>
  <text x="650" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="start">Thermostat &amp; Heating Element</text>
  <text x="650" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70" text-anchor="start">Regulates 120°F target temperature</text>

  <!-- Drain Valve -->
  <path d="M530 485 H640" stroke="#0B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="640" cy="485" r="4" fill="#0B2A4A"/>
  <text x="650" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="start">Brass / Composite Drain Valve</text>
  <text x="650" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70" text-anchor="start">Used for annual flushing and draining</text>
</svg>
