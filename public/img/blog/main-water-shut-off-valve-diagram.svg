<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <rect width="800" height="500" fill="#FAF6EF" rx="16"/>

  <!-- Title -->
  <text x="400" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0B2A4A" text-anchor="middle">Main Water Shut-Off Valve Types in Arizona Homes</text>
  <text x="400" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4A5A70" text-anchor="middle">Comparing older multi-turn gate valves with modern quarter-turn ball valves</text>

  <!-- Left: Gate Valve -->
  <g transform="translate(80, 110)">
    <rect width="300" height="340" rx="12" fill="#FFFFFF" stroke="#0B2A4A" stroke-width="1.5"/>
    <text x="150" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0B2A4A" text-anchor="middle">Gate Valve (Older Standard)</text>

    <!-- Pipe Horizontal -->
    <rect x="40" y="160" width="220" height="28" rx="4" fill="#B45309" stroke="#78350F" stroke-width="2"/>
    <!-- Valve Body -->
    <rect x="125" y="145" width="50" height="58" rx="6" fill="#D97706" stroke="#92400E" stroke-width="2"/>
    <!-- Stem -->
    <rect x="144" y="100" width="12" height="46" fill="#78350F"/>
    <!-- Round Wheel Handle -->
    <ellipse cx="150" cy="100" rx="42" ry="16" fill="#BE123C" stroke="#881337" stroke-width="2.5"/>
    <ellipse cx="150" cy="100" rx="18" ry="7" fill="#FFFFFF"/>

    <!-- Bullets -->
    <text x="50" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#BE123C">• Requires multiple clockwise turns</text>
    <text x="50" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A5A70">• Internal gate can snap off or seize</text>
    <text x="50" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A5A70">• High failure rate in Phoenix hard water</text>
    <text x="50" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D97706" font-weight="600">• Recommendation: Upgrade to ball valve</text>
  </g>

  <!-- Right: Ball Valve -->
  <g transform="translate(420, 110)">
    <rect width="300" height="340" rx="12" fill="#FFFFFF" stroke="#1FA971" stroke-width="2"/>
    <text x="150" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0B2A4A" text-anchor="middle">Ball Valve (Modern Standard)</text>

    <!-- Pipe Horizontal -->
    <rect x="40" y="160" width="220" height="28" rx="4" fill="#1479AE" stroke="#0F6A9A" stroke-width="2"/>
    <!-- Valve Body -->
    <rect x="125" y="145" width="50" height="58" rx="8" fill="#D97706" stroke="#92400E" stroke-width="2"/>
    <!-- Lever Handle (Quarter Turn) -->
    <rect x="145" y="115" width="10" height="30" fill="#0B2A4A"/>
    <!-- Yellow Lever in Open Position (Parallel) -->
    <rect x="140" y="105" width="100" height="16" rx="4" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
    <circle cx="150" cy="113" r="6" fill="#0B2A4A"/>

    <!-- Bullets -->
    <text x="50" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1FA971">• Simple 90° quarter-turn operation</text>
    <text x="50" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A5A70">• Parallel to pipe = ON / Open</text>
    <text x="50" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A5A70">• Perpendicular to pipe = OFF / Closed</text>
    <text x="50" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1FA971" font-weight="600">• Fast, reliable shut-off during emergencies</text>
  </g>
</svg>
