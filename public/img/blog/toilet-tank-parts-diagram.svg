<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" fill="none">
  <rect width="800" height="550" fill="#FAF6EF" rx="16"/>

  <!-- Title -->
  <text x="400" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0B2A4A" text-anchor="middle">Inside a Running Toilet Tank: Anatomy &amp; Wear Points</text>
  <text x="400" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4A5A70" text-anchor="middle">The 4 primary causes of continuous phantom running or slow tank leaking</text>

  <!-- Porcelain Tank Outline -->
  <path d="M220 110 H580 V420 Q580 440 560 440 H240 Q220 440 220 420 Z" fill="#FFFFFF" stroke="#0B2A4A" stroke-width="3"/>

  <!-- Water Fill in Tank -->
  <path d="M224 240 H576 V416 Q576 436 558 436 H242 Q224 436 224 416 Z" fill="#E6F4FB" opacity="0.6"/>

  <!-- Overflow Tube & Flush Valve -->
  <rect x="420" y="200" width="24" height="236" fill="#CBD5E1" stroke="#4A5A70" stroke-width="2"/>
  <!-- Water Level Line Mark -->
  <line x1="230" y1="235" x2="570" y2="235" stroke="#1E9BD7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="560" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1479AE" text-anchor="end">Water level (1" below top)</text>

  <!-- Rubber Flapper -->
  <path d="M410 430 Q432 405 454 430 Z" fill="#BE123C" stroke="#881337" stroke-width="2"/>
  <!-- Flush Hole -->
  <ellipse cx="432" cy="436" rx="20" ry="6" fill="#0B2A4A"/>

  <!-- Flush Lever & Arm -->
  <circle cx="250" cy="150" r="12" fill="#CBD5E1" stroke="#0B2A4A" stroke-width="2"/>
  <line x1="250" y1="150" x2="380" y2="160" stroke="#0B2A4A" stroke-width="4"/>

  <!-- Flapper Chain -->
  <path d="M380 160 Q400 280 432 410" stroke="#0B2A4A" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Fill Valve Assembly (Left) -->
  <rect x="290" y="170" width="20" height="266" fill="#1479AE" stroke="#0B2A4A" stroke-width="2"/>
  <!-- Float Cup -->
  <rect x="278" y="210" width="44" height="50" rx="6" fill="#1E9BD7" stroke="#0F6A9A" stroke-width="2"/>
  <!-- Refill Tube to Overflow -->
  <path d="M300 170 Q360 140 430 205" stroke="#0B2A4A" stroke-width="3" fill="none"/>

  <!-- Supply Line below Tank -->
  <rect x="296" y="440" width="8" height="60" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
  <circle cx="300" cy="500" r="8" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <text x="320" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A" font-weight="600">Wall Shut-Off Valve</text>

  <!-- Callout Labels -->
  <!-- 1. Fill Valve & Float -->
  <path d="M120 220 H270" stroke="#1E9BD7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="120" cy="220" r="4" fill="#1E9BD7"/>
  <text x="110" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="end">1. Fill Valve &amp; Float Cup</text>
  <text x="110" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70" text-anchor="end">If stuck or cracked, water runs constantly</text>

  <!-- 2. Refill Tube -->
  <path d="M140 140 H290" stroke="#0B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="140" cy="140" r="4" fill="#0B2A4A"/>
  <text x="130" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="end">2. Refill Tube</text>
  <text x="130" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70" text-anchor="end">Directs water into overflow tube during cycle</text>

  <!-- 3. Flapper & Chain -->
  <path d="M680 420 H450" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="680" cy="420" r="4" fill="#BE123C"/>
  <text x="690" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#BE123C" text-anchor="start">3. Rubber Flapper (Most Common!)</text>
  <text x="690" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70" text-anchor="start">Degrades from chlorine/calcium, causing slow leaks</text>

  <!-- 4. Overflow Tube -->
  <path d="M660 210 H445" stroke="#0B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="660" cy="210" r="4" fill="#0B2A4A"/>
  <text x="670" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="start">4. Overflow Tube</text>
  <text x="670" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70" text-anchor="start">Prevents tank overflow if fill valve fails</text>
</svg>
