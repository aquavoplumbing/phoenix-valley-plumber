<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" fill="none">
  <rect width="800" height="520" fill="#FAF6EF" rx="16"/>

  <!-- Title -->
  <text x="400" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0B2A4A" text-anchor="middle">Slab Leak Anatomy in Phoenix Monolithic Foundations</text>
  <text x="400" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4A5A70" text-anchor="middle">How copper corrosion and expansive desert soil trigger pressurized under-slab pipe failures</text>

  <!-- Flooring Layer (Tile / Vinyl / Hardwood) -->
  <rect x="100" y="140" width="600" height="20" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="120" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0B2A4A">Finished Home Flooring</text>

  <!-- Warm Spot / Moisture Zone on Floor -->
  <rect x="360" y="140" width="120" height="20" fill="#FF7A1A" opacity="0.4"/>
  <text x="420" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#BE123C" text-anchor="middle">Warm Spot / Damp Floor</text>

  <!-- Concrete Slab (4-6 inches) -->
  <rect x="100" y="160" width="600" height="90" fill="#94A3B8" stroke="#64748B" stroke-width="2"/>
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Monolithic Concrete Slab (4"–6")</text>

  <!-- Gravel / Sand Bedding -->
  <rect x="100" y="250" width="600" height="60" fill="#E2D9C8" stroke="#D1C7B3" stroke-width="1.5"/>
  <text x="120" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#78350F">Sand / Pea Gravel Bedding Layer</text>

  <!-- Expansive Desert Soil / Caliche -->
  <rect x="100" y="310" width="600" height="150" fill="#C2B29A" stroke="#A8967D" stroke-width="2"/>
  <text x="120" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#574936">Expansive Arizona Clay &amp; Caliche Soil</text>
  <text x="120" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#574936">Expands when saturated, shifts foundations</text>

  <!-- Underground Copper Water Line -->
  <rect x="140" y="280" width="520" height="18" rx="4" fill="#B45309" stroke="#78350F" stroke-width="2"/>
  <text x="630" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="end">Pressurized Copper Line</text>

  <!-- Pinhole Leak / Water Spray -->
  <circle cx="420" cy="289" r="6" fill="#1E9BD7"/>
  <!-- Water saturation plume -->
  <ellipse cx="420" cy="300" rx="90" ry="40" fill="#1E9BD7" opacity="0.35"/>
  <ellipse cx="420" cy="275" rx="55" ry="35" fill="#1E9BD7" opacity="0.45"/>
  <!-- Leak Plume Arrows -->
  <path d="M420 280 V240" stroke="#1479AE" stroke-width="2.5" stroke-dasharray="3 3"/>
  <path d="M400 285 L360 260" stroke="#1479AE" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M440 285 L480 260" stroke="#1479AE" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Leak Label Pointer -->
  <path d="M420 290 L420 440 H500" stroke="#BE123C" stroke-width="2"/>
  <circle cx="420" cy="290" r="4" fill="#BE123C"/>
  <text x="510" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#BE123C">Pinhole Leak in Buried Line</text>
  <text x="510" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4A5A70">Soil chemistry &amp; hard water corrosion erode copper wall</text>
</svg>
