<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" fill="none">
  <rect width="800" height="540" fill="#FAF6EF" rx="16"/>

  <!-- Title -->
  <text x="400" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0B2A4A" text-anchor="middle">Phoenix Home Plumbing Seasonal Checklist</text>
  <text x="400" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4A5A70" text-anchor="middle">Preventative maintenance cadence tailored for hot desert summers and monsoon rains</text>

  <!-- 4 Seasonal Cards -->
  <!-- 1. Spring (Pre-Summer) -->
  <g transform="translate(60, 95)">
    <rect width="320" height="195" rx="10" fill="#FFFFFF" stroke="#1E9BD7" stroke-width="1.5"/>
    <rect width="320" height="38" rx="10" fill="#E6F4FB"/>
    <text x="160" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="middle">Spring (March – May)</text>
    <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Test main water shut-off valve operation</text>
    <text x="20" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Inspect outdoor hose bibs &amp; vacuum breakers</text>
    <text x="20" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Service water softener brine tank &amp; salt bridges</text>
    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Clear yard landscape drainage channels</text>
  </g>

  <!-- 2. Summer (Peak Desert Heat) -->
  <g transform="translate(420, 95)">
    <rect width="320" height="195" rx="10" fill="#FFFFFF" stroke="#FF7A1A" stroke-width="1.5"/>
    <rect width="320" height="38" rx="10" fill="#FFF7ED"/>
    <text x="160" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">Summer (June – August)</text>
    <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Inspect PRV (pressure reducing valve) &lt;75 PSI</text>
    <text x="20" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Clean French drains before monsoon storms</text>
    <text x="20" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Check disposal &amp; kitchen lines for odor</text>
    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Test sump &amp; basement pumps for storm run-off</text>
  </g>

  <!-- 3. Fall (Post-Monsoon Flush) -->
  <g transform="translate(60, 310)">
    <rect width="320" height="195" rx="10" fill="#FFFFFF" stroke="#1FA971" stroke-width="1.5"/>
    <rect width="320" height="38" rx="10" fill="#F0FDF4"/>
    <text x="160" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#117A4F" text-anchor="middle">Fall (September – November)</text>
    <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Annual water heater tank flush (remove scale)</text>
    <text x="20" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Inspect anode rod for aggressive wear</text>
    <text x="20" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Camera inspect main sewer for tree root growth</text>
    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Check under-sink angle stops for calcium crust</text>
  </g>

  <!-- 4. Winter (Freeze & Valve Prep) -->
  <g transform="translate(420, 310)">
    <rect width="320" height="195" rx="10" fill="#FFFFFF" stroke="#0B2A4A" stroke-width="1.5"/>
    <rect width="320" height="38" rx="10" fill="#F1F5F9"/>
    <text x="160" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="middle">Winter (December – February)</text>
    <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Insulate exposed exterior copper risers</text>
    <text x="20" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Disconnect garden hoses before overnight frost</text>
    <text x="20" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Verify water heater temperature is set to 120°F</text>
    <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0B2A4A">• Check toilets with dye test for flapper leaks</text>
  </g>
</svg>
