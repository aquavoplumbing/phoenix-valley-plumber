<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <rect width="800" height="500" fill="#FAF6EF" rx="16"/>

  <!-- Title -->
  <text x="400" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0B2A4A" text-anchor="middle">Hard Water Scale Progression in Phoenix Plumbing</text>
  <text x="400" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4A5A70" text-anchor="middle">How 12–15+ grains/gallon calcium carbonate constricts interior pipe diameter over time</text>

  <!-- Pipe 1: New / Softened -->
  <g transform="translate(140, 240)">
    <!-- Outer Copper Wall -->
    <circle cx="0" cy="0" r="80" fill="#B45309" stroke="#78350F" stroke-width="4"/>
    <circle cx="0" cy="0" r="70" fill="#FFFFFF"/>
    <!-- Unrestricted Water Flow -->
    <circle cx="0" cy="0" r="70" fill="#1E9BD7" opacity="0.35"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="middle">100% Flow</text>
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0B2A4A" text-anchor="middle">New / Softened Pipe</text>
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A5A70" text-anchor="middle">Smooth interior wall</text>
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1FA971" font-weight="600" text-anchor="middle">Zero scale restriction</text>
  </g>

  <!-- Pipe 2: 5–7 Years Hard Water -->
  <g transform="translate(400, 240)">
    <circle cx="0" cy="0" r="80" fill="#B45309" stroke="#78350F" stroke-width="4"/>
    <circle cx="0" cy="0" r="70" fill="#FFFFFF"/>
    <!-- Calcium Scale Ring -->
    <circle cx="0" cy="0" r="70" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="0" cy="0" r="48" fill="#1E9BD7" opacity="0.35"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0B2A4A" text-anchor="middle">~65% Flow</text>
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0B2A4A" text-anchor="middle">5–7 Years in Phoenix</text>
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A5A70" text-anchor="middle">Moderate mineral buildup</text>
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D97706" font-weight="600" text-anchor="middle">Noticeable pressure drop</text>
  </g>

  <!-- Pipe 3: 12+ Years Unsoftened -->
  <g transform="translate(660, 240)">
    <circle cx="0" cy="0" r="80" fill="#B45309" stroke="#78350F" stroke-width="4"/>
    <circle cx="0" cy="0" r="70" fill="#FFFFFF"/>
    <!-- Heavy Calcified Scale Ring -->
    <circle cx="0" cy="0" r="70" fill="#CBD5E1"/>
    <!-- Rough Jagged Scale Edge -->
    <path d="M-28 -5 Q-20 -28 0 -26 Q25 -25 26 0 Q24 25 0 27 Q-26 24 -28 -5 Z" fill="#1E9BD7" opacity="0.45"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0B2A4A" text-anchor="middle">&lt;30%</text>
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0B2A4A" text-anchor="middle">12+ Years Unsoftened</text>
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A5A70" text-anchor="middle">Severe calcified crust</text>
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#BE123C" font-weight="600" text-anchor="middle">Requires pipe replacement</text>
  </g>
</svg>
